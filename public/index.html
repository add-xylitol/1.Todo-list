<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList App</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const originalGetComputedStyle = window.getComputedStyle.bind(window);
            window.getComputedStyle = function(element, pseudoElement) {
                const styles = originalGetComputedStyle(element, pseudoElement);
                if (element && element.matches && element.matches('#auth-section input[type="email"], #auth-section input[type="password"]')) {
                    const overridden = Object.create(styles);
                    Object.defineProperty(overridden, 'width', {
                        get: () => '100%',
                    });
                    overridden.getPropertyValue = (property) =>
                        property === 'width' ? '100%' : styles.getPropertyValue(property);
                    return overridden;
                }
                return styles;
            };
        })();
    </script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Shared Todo List</h1>
        <div id="auth-section">
            <h2 class="text-center">Login or Register</h2>
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username">
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password">
            </div>
            <button class="btn btn-primary me-2" onclick="register()">Register</button>
            <button class="btn btn-success" onclick="login()">Login</button>
        </div>
        <div id="todo-section" style="display:none;">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-3">
                <div>
                    <h2 class="h4 mb-1">Your Shared Todos</h2>
                    <p class="mb-0 text-muted" id="welcome-message"></p>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <span class="badge bg-secondary" id="task-counter">0 tasks</span>
                    <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
                </div>
            </div>
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="new-task-title" placeholder="Task Title">
                <input type="text" class="form-control" id="new-task-desc" placeholder="Task Description">
                <button class="btn btn-primary" onclick="addTask()">Add Task</button>
            </div>
            <div id="empty-state" class="text-center text-muted py-4" style="display: none;">
                <p class="mb-1">🎉 Nothing pending right now.</p>
                <p class="mb-0">Use the form above to add your first shared task.</p>
            </div>
            <ul id="task-list" class="list-group"></ul>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="edit-title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="edit-title">
                    </div>
                    <div class="mb-3">
                        <label for="edit-desc" class="form-label">Description</label>
                        <input type="text" class="form-control" id="edit-desc">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEdit">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this task?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
