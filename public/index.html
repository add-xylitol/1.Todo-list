<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime TodoList</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
      <div class="app-card">
        <div class="header">
          <div class="brand">
            <div class="logo"></div>
            <div class="title">Realtime TodoList</div>
          </div>
          <div class="user-area d-flex align-items-center gap-2">
            <span id="user-info" class="badge badge-avatar d-none"></span>
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary d-none" onclick="logout()">退出</button>
          </div>
        </div>
        <div class="section" id="auth-section">
          <div class="auth-box">
            <div class="input-group">
              <span class="input-group-text">@</span>
              <input type="text" class="form-control" id="username" placeholder="用户名">
            </div>
            <div class="input-group">
              <span class="input-group-text">📧</span>
              <input type="email" class="form-control" id="email" placeholder="邮箱">
            </div>
            <div class="input-group">
              <span class="input-group-text">#</span>
              <input type="text" class="form-control" id="auth-share-code" placeholder="共享码（可选）">
            </div>
            <div class="input-group">
              <span class="input-group-text">🔒</span>
              <input type="password" class="form-control" id="password" placeholder="密码">
            </div>
            <div class="d-grid gap-2 d-sm-flex">
              <button class="btn btn-primary" onclick="register()">注册并登录</button>
              <button class="btn btn-success" onclick="login()">登录</button>
            </div>
          </div>
        </div>
        <div class="section" id="todo-section" style="display:none;">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
            <h2 class="m-0 fs-5"><span id="greeting">我的待办</span> <span class="text-secondary" id="task-count"></span></h2>
            <div class="d-flex gap-2 align-items-center">
              <div class="btn-group" role="group" aria-label="Filter">
                <button class="btn btn-sm btn-outline-secondary active" id="filter-all">全部</button>
                <button class="btn btn-sm btn-outline-secondary" id="filter-active">未完成</button>
                <button class="btn btn-sm btn-outline-secondary" id="filter-completed">已完成</button>
              </div>
              <input type="search" id="search-input" class="form-control form-control-sm" placeholder="搜索任务...">
            </div>
          </div>
          <!-- Shared List Bar -->
          <div class="share-bar mb-3">
            <div class="left d-flex gap-2 align-items-center flex-wrap">
              <input type="text" id="share-code-input" class="form-control form-control-sm" placeholder="输入共享码或留空创建随机码" style="max-width:260px;" list="share-codes">
              <datalist id="share-codes"></datalist>
              <button class="btn btn-sm btn-primary" id="btn-create-share">创建共享</button>
              <button class="btn btn-sm btn-success" id="btn-join-share">加入共享</button>
              <button class="btn btn-sm btn-outline-secondary" id="btn-refresh">刷新</button>
              <button class="btn btn-sm btn-outline-secondary" id="btn-history">历史记录</button>
            </div>
            <div class="right d-flex align-items-center gap-2">
              <div id="share-status" class="share-status d-none">未共享</div>
              <button class="btn btn-sm btn-outline-secondary d-none" id="btn-copy-code" title="复制共享码">复制码</button>
              <button class="btn btn-sm btn-outline-danger d-none" id="btn-leave" title="退出当前共享">退出共享</button>
              <div id="perm-area" class="d-none">
                <div class="form-check form-switch m-0">
                  <input class="form-check-input" type="checkbox" role="switch" id="perm-only-owner">
                  <label class="form-check-label" for="perm-only-owner">仅创建者可删除</label>
                </div>
              </div>
            </div>
          </div>
          <div class="task-input mb-3">
            <input type="text" class="form-control" id="new-task-title" placeholder="任务标题，例如：和团队同步需求">
            <input type="text" class="form-control" id="new-task-desc" placeholder="补充说明（可选）">
            <button class="btn btn-primary" id="addBtn" onclick="addTask()">添加</button>
          </div>
          <div id="list-container" class="position-relative">
            <ul id="task-list" class="list-group"></ul>
            <div id="empty-state" class="text-center text-secondary py-4 d-none">暂无任务，开始创建你的第一条待办吧 ✨</div>
            <div id="loading" class="position-absolute top-0 start-0 w-100 h-100 d-none" style="backdrop-filter:blur(2px); background:rgba(0,0,0,0.06);">
              <div class="d-flex justify-content-center align-items-center h-100">
                <div class="spinner-border text-primary" role="status"><span class="visually-hidden">加载中...</span></div>
              </div>
            </div>
          </div>
          <div class="footer d-flex justify-content-between align-items-center">
            <div id="realtime-indicator">实时协作已开启</div>
            <button id="clear-completed" class="btn btn-sm btn-outline-secondary">清除已完成</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">编辑任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="edit-title" class="form-label">标题</label>
                        <input type="text" class="form-control" id="edit-title">
                    </div>
                    <div class="mb-3">
                        <label for="edit-desc" class="form-label">说明</label>
                        <input type="text" class="form-control" id="edit-desc">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveEdit">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    确定要删除该任务吗？
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="historyModalLabel">修改历史</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <ul id="history-list" class="list-group small"></ul>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toasts -->
    <div aria-live="polite" aria-atomic="true" class="position-fixed top-0 end-0 p-3" style="z-index:1080;">
      <div id="toast-container" class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="right: auto; z-index: 1080;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
